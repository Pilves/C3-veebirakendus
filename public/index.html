<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Findings search</title>
  <!-- The server's Content-Security-Policy allows only same-origin files: no inline
       script, no inline style, nothing from another site. -->
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <h1>Findings search</h1>
    <!-- Not a <form>: nothing is ever submitted to the server as a form (the policy has
         form-action 'none'). app.js listens to the controls and calls the API itself. -->
    <div class="controls" role="search">
      <div class="field field-query">
        <label for="query">Search in entity and notes</label>
        <input id="query" type="search" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="type">Type</label>
        <select id="type">
          <option value="">All types</option>
          <option value="domain">domain</option>
          <option value="ip">ip</option>
          <option value="email">email</option>
          <option value="handle">handle</option>
          <option value="alias">alias</option>
          <option value="wallet">wallet</option>
          <option value="unknown">unknown</option>
        </select>
      </div>
      <div class="field">
        <label for="case">Case</label>
        <select id="case">
          <option value="">All cases</option>
        </select>
      </div>
      <div class="field field-check">
        <input id="duplicates" type="checkbox">
        <label for="duplicates">Include re-imported duplicates</label>
      </div>
    </div>
    <p id="case-error" class="error" hidden>The list of cases could not be loaded.</p>
  </header>

  <main>
    <section id="results" aria-labelledby="results-heading">
      <h2 id="results-heading">Results</h2>
      <p id="summary" role="status" aria-live="polite">Loading…</p>
      <p id="truncated" class="notice" hidden>
        The query was too long. Only its first 200 characters and first 10 words were used.
      </p>
      <div id="search-error" class="error" role="alert" hidden>
        <p id="search-error-text"></p>
        <button id="retry" type="button">Try again</button>
      </div>
      <div id="empty" hidden>
        <p>No findings match this search and these filters.</p>
        <button id="open-as-id" type="button" hidden></button>
      </div>
      <ul id="hits"></ul>
      <nav id="pager" aria-label="Result pages" hidden>
        <button id="previous" type="button">Previous</button>
        <span id="range"></span>
        <button id="next" type="button">Next</button>
      </nav>
      <p id="zone-note" class="muted"></p>
    </section>

    <aside id="detail" aria-labelledby="detail-heading">
      <h2 id="detail-heading" tabindex="-1">Finding details</h2>
      <button id="close-detail" type="button" hidden>Back to results</button>
      <div id="detail-body">
        <p class="muted">Select a finding to see its details.</p>
      </div>
    </aside>
  </main>

  <noscript><p class="error">This page needs JavaScript to search the findings.</p></noscript>
</body>
</html>
